[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "containermaster-backend"
version = "0.1.0"
description = "Python backend for ContainerMaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "docker>=7.1,<8.0",
  "psutil>=7.0,<8.0",
  "PyJWT>=2.10,<3.0",
  "bcrypt>=4.1,<5.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "B008",   # function call in argument defaults (padrão FastAPI Body/Query/Depends)
    "RUF012", # mutable class attributes in Pydantic/dataclasses
    "E501",   # line length (gerenciado pelo ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
