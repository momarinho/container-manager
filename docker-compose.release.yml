services:
  docker-proxy:
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}
    container_name: containermaster-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - EXEC=1
      - INFO=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - GRPC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - containermaster-net

  backend:
    image: ${BACKEND_IMAGE_NAME:-ghcr.io/your-org/containermaster-backend}:${BACKEND_IMAGE_TAG:-latest}
    container_name: containermaster-backend
    restart: unless-stopped
    depends_on:
      - docker-proxy
    env_file:
      - ./backend/.env
    environment:
      - APP_NAME=${APP_NAME:-containermaster-backend}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - APP_COMMIT_SHA=${APP_COMMIT_SHA:-local}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ENABLE_ACCESS_LOGS=${ENABLE_ACCESS_LOGS:-true}
      - DOCKER_HOST=tcp://docker-proxy:2375
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - containermaster-net

  frontend-web:
    image: ${FRONTEND_IMAGE_NAME:-ghcr.io/your-org/containermaster-frontend-web}:${FRONTEND_IMAGE_TAG:-latest}
    container_name: containermaster-frontend-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_WEB_HOST_PORT:-8081}:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - containermaster-net

networks:
  containermaster-net:
    driver: bridge
